<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>티고ABC | AI Beauty Check</title>
    <meta
      name="description"
      content="내 몸을 이해하는 가장 똑똑한 방법, 티고 ABC AI 분석 솔루션"
    />

    <!-- Open Graph -->
    <meta property="og:title" content="티고ABC | AI Beauty Check" />
    <meta
      property="og:description"
      content="내 몸을 이해하는 가장 똑똑한 방법, 티고 ABC AI 분석 솔루션"
    />
    <meta
      property="og:image"
      content="%VITE_PUBLIC_URL%/og_image.png"
    />

    <!-- 파비콘 -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <!-- 테마 -->
    <meta
      name="theme-color"
      content="#f6f9ff"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#1a1b24"
      media="(prefers-color-scheme: dark)"
    />
    <script>
      // 이 로직은 src/store/theme.ts의 setTheme과 동일해야 함
      try {
        const themeStore = localStorage.getItem("ThemeStore")
          ? JSON.parse(localStorage.getItem("ThemeStore"))
          : null;

        const theme = themeStore?.state?.theme ?? "light";

        const htmlTag = document.documentElement;
        htmlTag.classList.remove("dark", "light");

        if (theme === "system") {
          const isDarkTheme = window.matchMedia(
            "(prefers-color-scheme: dark)",
          ).matches;

          htmlTag.classList.add(isDarkTheme ? "dark" : "light");
        } else {
          htmlTag.classList.add(theme);
        }
      } catch (error) {
        console.error(error);
      }
    </script>
  </head>
  <body>
    <div id="app-frame">
      <div id="modal-root"></div>
      <div id="root"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
