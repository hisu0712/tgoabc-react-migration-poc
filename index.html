<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>티고ABC | AI 두피·퍼스널 분석</title>
    <meta
      name="description"
      content="AI 기반 두피·퍼스널 분석과 맞춤 관리 솔루션. 미용실을 위한 전문가 설계 종합 분석 시스템."
    />

    <!-- Open Graph -->
    <meta property="og:title" content="티고ABC | AI 두피·퍼스널 분석" />
    <meta
      property="og:description"
      content="AI 기반 두피·퍼스널 분석과 맞춤 관리 솔루션. 미용실을 위한 전문가 설계 종합 분석 시스템."
    />
    <meta
      property="og:image"
      content="https://tgoabc.com/assets/images/og_image.png"
    />

    <!-- 파비콘 -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <!-- 테마 -->
    <meta
      name="theme-color"
      content="#f6f9ff"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#1a1b24"
      media="(prefers-color-scheme: dark)"
    />
    <script>
      // 이 로직은 src/store/theme.ts의 setTheme과 동일해야 함
      try {
        const themeStore = localStorage.getItem("ThemeStore")
          ? JSON.parse(localStorage.getItem("ThemeStore"))
          : null;

        const theme = themeStore?.state?.theme ?? "light";

        const htmlTag = document.documentElement;
        htmlTag.classList.remove("dark", "light");

        if (theme === "system") {
          const isDarkTheme = window.matchMedia(
            "(prefers-color-scheme: dark)",
          ).matches;

          htmlTag.classList.add(isDarkTheme ? "dark" : "light");
        } else {
          htmlTag.classList.add(theme);
        }
      } catch (error) {
        console.error(error);
      }
    </script>
  </head>
  <body>
    <div id="modal-root"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
